<!-- 1. Handle Form Submit Event 
Create a simple form with a name input and submit button. Use the submit event to display a message 
when the form is submitted. 
Example: 
Input: 
Name: Rahul 
Output: 
Form submitted successfully! -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <input type="text" id="input">
        <button id="btn">Submit</button>
        <h2></h2>
    </form>
    <script>
        const input = document.querySelector("#input");
        const form = document.querySelector("form");
        const btn = document.querySelector("#btn");
        btn.addEventListener("click", (e) => {
            if(input.value.length == 0){
                document.querySelector("h2").textContent = "Enter your Name";
            }else{
                document.querySelector("h2").textContent = "Form Submited Successfully";
            }
        })
    </script>
</body>
</html>
