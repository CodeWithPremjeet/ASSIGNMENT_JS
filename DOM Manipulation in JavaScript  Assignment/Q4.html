<!-- 4. Change Content Using textContent 
Create a paragraph containing some text and use textContent to replace its content with a new message. 
Example: 
Before: <p id="message">Old Message</p> 
After: Welcome to JavaScript! -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="message">Old message</p>
    <script>
        const paragraph = document.querySelector("#message");
        paragraph.textContent = "Welcome to JavaScript!";
    </script>
</body>
</html>
