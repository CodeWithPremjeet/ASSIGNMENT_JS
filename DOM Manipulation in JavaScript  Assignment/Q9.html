<!-- 9. Read Data Using dataset 
Create a button with a custom data-id attribute and use the dataset property to read its value. 
Example: 
HTML: <button id="productBtn" data-id="101">View Product</button> 
Output: 101 -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="productBtn" data-id="101">View Product</button>
    <script>
        const btn = document.querySelector("#productBtn");
        console.log(btn.dataset.id);
    </script>
</body>
</html>
