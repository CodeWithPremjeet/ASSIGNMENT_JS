<!-- 14. Remove an Element 
Create a list containing three items and remove one item using either removeChild() or remove(). 
Example: 
Before: HTML, CSS, JavaScript 
After: HTML, JavaScript -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="skills">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>
    <script>
        const ul = document.querySelector("#skills");
        const items = ul.children;
        ul.removeChild(items[1]);
    </script>
</body>
</html>
